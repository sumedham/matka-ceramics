<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap">
  {{ head_content }}
</head>
<body>

<div class="mk">

  <aside class="mk-side">

    <!-- ==========================================================
         PLACEHOLDER WORDMARK
         Drawn vector, not a typeface. Replace the whole <svg>
         with your own artwork once it's been vectorised:
             <img src="{{ 'logo.svg' | theme_image_url }}" alt="Matka Ceramics">
         Keep the stroke on currentColor so it inherits --red.
         ========================================================== -->
    <a class="mk-mark" href="{{ store.url }}">
      <svg viewBox="10 12 375 120" fill="none" stroke="currentColor" stroke-width="11"
           stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Matka">
        <path d="M24,110 C24,84 28,56 40,54 C52,52 56,70 56,110 C56,78 62,54 74,54 C86,54 90,72 90,110 C90,78 96,54 108,54 C120,54 124,74 122,110"/>
        <path d="M122,110 C126,117 133,116 140,108"/>
        <path d="M174,60 C158,50 140,60 140,80 C140,100 158,108 172,98"/>
        <path d="M174,58 C174,80 173,98 176,110"/>
        <path d="M176,110 C180,116 187,115 194,107"/>
        <path d="M214,26 C212,60 210,90 212,102 C214,112 224,112 232,104"/>
        <path d="M198,56 C210,54 224,53 234,52"/>
        <path d="M252,24 C250,60 248,92 250,110"/>
        <path d="M250,82 C264,80 276,68 274,58 C272,48 260,52 252,70"/>
        <path d="M256,80 C268,86 278,98 286,110"/>
        <path d="M334,60 C318,50 300,60 300,80 C300,100 318,108 332,98"/>
        <path d="M334,58 C334,80 333,98 336,110"/>
        <path d="M336,110 C346,120 360,117 372,103"/>
      </svg>
      <em>ceramics</em>
    </a>

    <nav class="mk-nav">
      <a href="{{ store.url }}/products">Ceramics</a>
      {% for page in pages.all %}
        <a href="{{ page.url }}">{{ page.name }}</a>
      {% endfor %}
      <a class="cart" href="{{ store.url }}/cart">Cart ({{ cart.item_count }})</a>
    </nav>

  </aside>

  <main class="mk-main">

    {{ page_content }}

    <footer class="mk-foot">
      <p class="nl">New pieces and studio sale dates, roughly monthly.</p>
      <div class="lk">
        <a href="https://www.instagram.com/matkaceramics/" rel="me">Instagram</a>
        <a href="{{ store.url }}/contact">Contact</a>
      </div>
    </footer>

  </main>

</div>

</body>
</html>
